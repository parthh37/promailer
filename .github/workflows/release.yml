name: Release

# Two ways to release:
# - Actions tab > Release > Run workflow on main, choosing patch, minor or major: bumps Cargo.toml,
#   Cargo.lock and CHANGELOG.md, commits and tags on main, then builds, tests and publishes.
# - Push a tag like v0.2.0 (matching Cargo.toml) yourself.
# Running it with "none" only builds and smoke-tests the installers as an artifact; nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = test build only, no release)"
        type: choice
        options: [none, patch, minor, major]
        default: none

# One release at a time, so two bumps can't race for the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Passed via env (never interpolated into scripts) to avoid shell injection via ref names.
  REF_NAME: ${{ github.ref_name }}
  REF_TYPE: ${{ github.ref_type }}
  BUMP: ${{ inputs.bump || 'none' }}

jobs:
  # Decides which tag (if any) this run releases, creating it first when a bump was requested.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUMP != 'none'

      # Pushed with GITHUB_TOKEN, so the new tag does not start a second run of this workflow.
      - name: Bump version, commit and tag
        if: env.BUMP != 'none'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are cut from main; run the workflow on main, not $REF_NAME"
            exit 1
          fi
          version=$(scripts/bump-version.sh "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version"
          git tag -a "v$version" -m "Promailer $version"
          # Atomic: if main moved or the tag exists, neither the commit nor the tag is pushed.
          git push --atomic origin HEAD:main "v$version"
          echo "BUMPED_TAG=v$version" >> "$GITHUB_ENV"
          echo "::notice::Releasing v$version"

      - name: Release tag
        id: tag
        run: |
          if [ -n "${BUMPED_TAG:-}" ]; then tag=$BUMPED_TAG
          elif [ "$REF_TYPE" = tag ]; then tag=$REF_NAME
          else tag=; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Empty for test builds; the publish steps only run when it is set.
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Determine version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:TAG -and "v$v" -ne $env:TAG) {
            throw "Tag $env:TAG does not match Cargo.toml version $v"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        run: cargo test --workspace --release --locked

      - name: Build
        run: cargo build --workspace --release --locked

      # Code signing switches on once the SIGNING_CERT_PFX_BASE64 secret exists (plus
      # SIGNING_CERT_PASSWORD; optional variable SIGNING_TIMESTAMP_URL). Until then builds are unsigned.
      - name: Detect code signing
        id: signing
        shell: pwsh
        env:
          PFX: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          $enabled = [bool]$env:PFX
          "enabled=$($enabled.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $enabled) { Write-Host "::warning::Code signing is not configured (secret SIGNING_CERT_PFX_BASE64); binaries are unsigned." }

      - name: Sign executables
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
        run: .\scripts\sign.ps1 target\release\promailer.exe target\release\promailer-manager.exe target\release\promailer-tray.exe

      - name: Build installer
        shell: pwsh
        env:
          SIGNING: ${{ steps.signing.outputs.enabled }}
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $isccArgs = @("/DAppVersion=$env:VERSION")
          if ($env:SIGNING -eq 'true') {
            # Inno signs Setup.exe and the uninstaller it embeds; $f is the file to sign.
            $sign = Resolve-Path scripts\sign.ps1
            $isccArgs += '/DSign', "/Spromailer=pwsh -NoProfile -File `"$sign`" `$f"
          }
          & $iscc @isccArgs installer\promailer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      # WiX 5 is pinned: WiX 7+ requires accepting the OSMF EULA, which may carry a fee.
      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "installing WiX failed" }
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          & $wix build -arch x64 -d Version=$env:VERSION installer\promailer.wxs -o build\msi\Promailer-$env:VERSION-x64.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          Copy-Item build\msi\Promailer-$env:VERSION-x64.msi dist\

      - name: Sign MSI
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
        run: .\scripts\sign.ps1 "dist\Promailer-$env:VERSION-x64.msi"

      - name: Build portable zip
        shell: pwsh
        run: |
          $stage = "dist\Promailer-$env:VERSION-x64-portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\promailer.exe, target\release\promailer-manager.exe, target\release\promailer-tray.exe, README.md, CHANGELOG.md, config\promailer.example.toml $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          Remove-Item -Recurse $stage

      - name: Smoke test Setup.exe
        shell: pwsh
        run: .\scripts\smoke-test.ps1 -Installer (Resolve-Path "dist\Promailer-$env:VERSION-x64-Setup.exe")

      - name: Smoke test MSI
        shell: pwsh
        run: .\scripts\smoke-test.ps1 -Installer (Resolve-Path "dist\Promailer-$env:VERSION-x64.msi")

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: promailer-${{ env.VERSION }}
          path: dist/*

      - name: Release notes from CHANGELOG
        if: env.TAG != ''
        shell: pwsh
        env:
          SIGNING: ${{ steps.signing.outputs.enabled }}
        run: |
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n### Downloads`n- **Promailer-$env:VERSION-x64-Setup.exe** - installer (Windows service, Promailer Manager GUI, status icon, desktop shortcut, default config, PATH)`n- **Promailer-$env:VERSION-x64.msi** - MSI for Group Policy / SCCM / Intune (``msiexec /i ... /qn HOSTNAME=mail.example.com``)`n- **Promailer-$env:VERSION-x64-portable.zip** - standalone executables (service, manager GUI, status icon)`n- **SHA256SUMS.txt** - checksums"
          if ($env:SIGNING -ne 'true') { $notes += "`n`nBinaries in this release are not code-signed." }
          Set-Content release-notes.md $notes -Encoding utf8

      - name: Publish GitHub release
        if: env.TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG (Get-ChildItem dist -File).FullName `
            --title "Promailer $env:VERSION" --notes-file release-notes.md --verify-tag
