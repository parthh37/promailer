name: Release

# Push a tag like v0.2.0 (matching Cargo.toml) to build, test, package and publish.
on:
  push:
    tags: ["v*"]
  # Manual runs build and smoke-test the installer and upload it as an artifact; they never publish.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Passed via env (never interpolated into scripts) to avoid shell injection via ref names.
  REF_NAME: ${{ github.ref_name }}
  REF_TYPE: ${{ github.ref_type }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Determine version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:REF_TYPE -eq "tag" -and "v$v" -ne $env:REF_NAME) {
            throw "Tag $env:REF_NAME does not match Cargo.toml version $v"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=$env:VERSION installer\promailer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Build portable zip
        shell: pwsh
        run: |
          $stage = "dist\Promailer-$env:VERSION-x64-portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\promailer.exe, README.md, CHANGELOG.md, config\promailer.example.toml $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          Remove-Item -Recurse $stage

      - name: Smoke test installer
        shell: pwsh
        run: .\scripts\smoke-test.ps1 -Installer (Resolve-Path "dist\Promailer-$env:VERSION-x64-Setup.exe")

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: promailer-${{ env.VERSION }}
          path: dist/*

      - name: Release notes from CHANGELOG
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n### Downloads`n- **Promailer-$env:VERSION-x64-Setup.exe** - installer (Windows service, default config, PATH)`n- **Promailer-$env:VERSION-x64-portable.zip** - standalone executable`n- **SHA256SUMS.txt** - checksums"
          Set-Content release-notes.md $notes -Encoding utf8

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:REF_NAME (Get-ChildItem dist -File).FullName `
            --title "Promailer $env:VERSION" --notes-file release-notes.md --verify-tag
