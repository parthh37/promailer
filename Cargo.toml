[package]
name = "promailer"
version = "0.1.0"
edition = "2021"
description = "Production-grade outbound SMTP server for Windows - a modern replacement for the IIS6 SMTP service"
publish = false

[[bin]]
name = "promailer"
path = "src/main.rs"

[dependencies]
# Runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "fs", "sync", "macros", "signal"] }
futures = "0.3"

# TLS (ring backend: builds on Windows MSVC without CMake/NASM)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
# Certificate details (subject, validity) for both PEM and Windows-store certificates.
x509-cert = { version = "0.2", default-features = false }
ring = "0.17"

# DNS + email authentication (DKIM signing, SPF/DMARC evaluation)
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
mail-auth = { version = "0.13", default-features = false, features = ["ring", "generate"] }
mail-builder = "1"
rsa = { version = "0.9", features = ["pem"] }

# HTTP management / send API
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

# Config / CLI / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
humantime-serde = "1"
humantime = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Utilities
ipnet = { version = "2", features = ["serde"] }
arc-swap = "1"
parking_lot = "0.12"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ulid = "1"
anyhow = "1"
thiserror = "2"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
subtle = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# TLS private keys held by CNG (LocalMachine\My), including non-exportable and TPM-backed keys.
rustls-cng = { version = "0.7", default-features = false, features = ["ring", "tls12", "logging"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_EventLog",
    "Win32_System_Registry",
] }

[build-dependencies]
# Embeds the Event Log message table and version info into promailer.exe.
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"  # keep unwind: a panic in one session/delivery task must not kill the service

# Optimise dependencies even in debug builds (RSA keygen / crypto in tests).
[profile.dev.package."*"]
opt-level = 2
