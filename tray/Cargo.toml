[package]
name = "promailer-tray"
description = "Promailer notification-area (system tray) status icon"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "promailer-tray"
path = "src/main.rs"

[dependencies]
promailer-crash = { path = "../crash" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
